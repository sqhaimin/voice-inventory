<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square Register Voice Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="device-frame">
        <div class="device-screen">
            <!-- Status Bar -->
            <div class="status-bar">
                <div class="time">12:00 PM</div>
            </div>

            <!-- Main Content -->
            <div class="register-content">
                <div class="top-bar">
                    <div class="menu-button">≡</div>
                    <div class="page-title">Block SQUAWK 🗣️</div>
                    <div class="sync-status">●</div>
                </div>

                <div class="main-display">
                    <div class="voice-interface">
                        <div class="response-display">
                            <p id="transcriptText" class="transcript">Tap the mic and ask anything!</p>
                            <p id="responseText" class="response"></p>
                        </div>
                        
                        <div class="microphone-container">
                            <button id="micButton" class="mic-button">
                                <svg class="mic-icon" viewBox="0 0 24 24">
                                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                                </svg>
                            </button>
                            <div class="status-indicator" id="statusIndicator"></div>
                        </div>
                    </div>

                    <div class="history-panel">
                        <div class="history-header">Recent Queries</div>
                        <ul id="queryHistory" class="query-list">
                            <!-- Query history will be populated here -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Device Frame Elements -->
        <div class="device-home-button"></div>
    </div>
    
    <script>
        // Update time in status bar
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { 
                hour: 'numeric', 
                minute: '2-digit'
            });
            document.querySelector('.time').textContent = timeString;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
    <script src="app.js"></script>
</body>
</html>
