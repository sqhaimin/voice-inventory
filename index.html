<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Squawk</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Block SQUAWK</h1>
        </header>
        
        <main>
            <div class="voice-interface">
                <div class="microphone-container">
                    <button id="micButton" class="mic-button">
                        <svg class="mic-icon" viewBox="0 0 24 24">
                            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                        </svg>
                    </button>
                    <div class="status-indicator" id="statusIndicator"></div>
                </div>
                
                <div class="transcript-container">
                    <p id="transcriptText" class="transcript">Tap the microphone and ask anything!</p>
                </div>
                
                <div class="response-container">
                    <p id="responseText" class="response"></p>
                </div>
            </div>
            
            <div class="history-container">
                <h2>Recent Queries</h2>
                <ul id="queryHistory" class="query-list">
                    <!-- Query history will be populated here -->
                </ul>
            </div>
        </main>
        
        <footer>
            <p>Connected to Square Point of Sale</p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
